<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      `viewport-fit=cover` plus `user-scalable=no`: a wall-mounted terminal must not be
      pinch-zoomable. Somebody waiting in a queue will zoom the viewfinder by accident and
      the next person finds a screen they cannot read and cannot reset.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0A0A" />

    <!--
      Deliberately ES5, deliberately inline, and FIRST IN THE HEAD.

      Its whole job is to report failures that stop the module from running at all, so it
      cannot itself use anything that might not parse — no arrow functions, no const, no
      template literals. An inline classic script also runs even when the module script is
      rejected outright for unsupported syntax, which is the exact case on an older Safari.

      IT LIVES IN THE HEAD, ABOVE EVERYTHING, and that position is load-bearing. Vite hoists
      the entry module into <head> at build time. A module is deferred by spec, so a body
      script would still be armed before the module EVALUATES — but not necessarily before it
      FAILS TO LOAD: a 404 or a dropped connection fires an error event on the script element
      as soon as the fetch settles, which can be while the head is still being parsed. Armed
      here, nothing can fail earlier than the listener exists.
    -->
    <script>
      (function () {
        function show(label, detail) {
          var box = document.getElementById("kiosk-boot-error");
          var note = document.getElementById("kiosk-boot-note");
          if (!box) return;
          if (note) note.textContent = "The app could not start on this browser.";
          box.hidden = false;
          box.textContent = label + ": " + detail;
        }
        window.addEventListener("error", function (event) {
          // A failed script/stylesheet fires error on the ELEMENT, with no message.
          var target = event.target;
          if (target && target !== window && (target.src || target.href)) {
            show("Could not load", String(target.src || target.href));
            return;
          }
          show("Error", (event.message || "unknown") + " (" + (event.filename || "") + ":" + (event.lineno || 0) + ")");
        }, true);
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason;
          show("Failed", (reason && (reason.message || reason)) + "");
        });
      })();
    </script>

    <!--
      ── RUNTIME POLYFILLS FOR iOS 12.5.7 (SAFARI 12.1) ──────────────────────────
      `build.target: "safari12"` lowers SYNTAX. It never adds a runtime API, and esbuild
      says so explicitly. These are the five the shipped gate bundle actually reaches for
      and Safari 12.1 does not have — counted in the built output, not guessed from a
      compatibility table:

        Array.prototype.at      Safari 15.4   ×3   the one that would definitely throw
        Promise.allSettled      Safari 13     ×1
        Object.fromEntries      Safari 12.1   ×2   present on 12.1, absent on 12.0
        globalThis              Safari 12.1   ×2   same
        queueMicrotask          Safari 12.1   ×2   same

      ES5 only, and inline in the head above the hoisted module, for the same reason as the
      error reporter: it has to be running before the code that needs it, and it must not
      itself be the thing that fails to parse. Every definition is guarded, so a modern
      browser reads this and does nothing.
    -->
    <!--
      ── WHY THE GATE HAS ITS OWN ORIGIN: https://tt-gate.vercel.app ─────────────
      An installed web app OWNS ITS SCOPE. The HR product's manifest declares `scope: "/"`,
      which contains `/kiosk` — so on a device where TT HRMS is already installed, Chrome sees
      an installed app whose scope covers this page and offers to OPEN it rather than install
      it. "You already have this app." The two manifests differ in `id`, `name` and `scope` and
      it makes no difference: scope containment is what Chrome checks, and `/kiosk` is inside
      `/`.

      It cannot be fixed by narrowing the HR scope. Its routes are spread across `/me`,
      `/admin`, `/apply` and more, so `/` is the only prefix that covers them; anything
      narrower would drop half the product out of its own installed app.

      Installed apps are keyed PER ORIGIN, so a second origin has no HR app installed on it and
      no scope to collide with. `tt-gate.vercel.app` serves this same build, and installing the
      gate from there gives a genuinely separate app on the home screen. Both hosts keep
      working; only the install should be done from the gate one.
    -->

    <!--
      ── CATCH `beforeinstallprompt` BEFORE REACT EXISTS ─────────────────────────
      Chrome fires this event ONCE, and early — routinely before the module bundle has been
      parsed, let alone before React has mounted and attached a listener. A component that
      subscribes on mount is subscribing after the fact: the event is gone, `deferred` stays
      null, and the install bar never renders at all. Reported from an Android tablet as
      simply not being able to find the install link, and it was not there to find.

      So it is captured here, in the head, and parked on `window` for the component to collect
      whenever it gets around to mounting. `preventDefault()` suppresses Chrome's own mini
      infobar so there is one affordance rather than two.
    -->
    <script>
      (function () {
        window.__ttInstallEvent = null;
        window.addEventListener("beforeinstallprompt", function (event) {
          event.preventDefault();
          window.__ttInstallEvent = event;
        });
        window.addEventListener("appinstalled", function () {
          window.__ttInstallEvent = null;
          window.__ttInstalled = true;
        });
      })();
    </script>

    <script>
      (function () {
        /* globalThis — everything below may want it, so it goes first. */
        if (typeof globalThis !== "object" || globalThis === null) {
          Object.defineProperty(Object.prototype, "__magic__", {
            get: function () {
              return this;
            },
            configurable: true
          });
          /* eslint-disable no-undef */
          __magic__.globalThis = __magic__;
          delete Object.prototype.__magic__;
        }

        var G = typeof globalThis === "object" ? globalThis : window;

        /* Array.prototype.at / String.prototype.at — negative indices count from the end. */
        function at(index) {
          var length = this.length;
          var i = Math.trunc(index) || 0;
          if (i < 0) i += length;
          if (i < 0 || i >= length) return undefined;
          return this[i];
        }
        if (!Array.prototype.at) {
          Object.defineProperty(Array.prototype, "at", {
            value: at,
            writable: true,
            configurable: true
          });
        }
        if (!String.prototype.at) {
          Object.defineProperty(String.prototype, "at", {
            value: at,
            writable: true,
            configurable: true
          });
        }

        /* Promise.allSettled — never rejects; one result object per input. */
        if (G.Promise && !G.Promise.allSettled) {
          G.Promise.allSettled = function (values) {
            var wrapped = Array.prototype.map.call(values, function (item) {
              return G.Promise.resolve(item).then(
                function (value) {
                  return { status: "fulfilled", value: value };
                },
                function (reason) {
                  return { status: "rejected", reason: reason };
                }
              );
            });
            return G.Promise.all(wrapped);
          };
        }

        /* Object.fromEntries — accepts any iterable of [key, value] pairs. */
        if (!Object.fromEntries) {
          Object.fromEntries = function (entries) {
            var out = {};
            Array.prototype.forEach.call(
              Array.from ? Array.from(entries) : entries,
              function (pair) {
                out[pair[0]] = pair[1];
              }
            );
            return out;
          };
        }

        /*
          queueMicrotask — a resolved promise is a real microtask, so ordering is right.
          The rethrow is deliberate: the spec reports the exception globally rather than
          turning it into an unhandled rejection, and the error reporter above is listening.
        */
        if (typeof G.queueMicrotask !== "function") {
          G.queueMicrotask = function (callback) {
            G.Promise.resolve().then(callback).catch(function (error) {
              setTimeout(function () {
                throw error;
              }, 0);
            });
          };
        }

        /*
          ── DOES FLEXBOX `gap` WORK? ────────────────────────────────────────────
          `gap` in a FLEX container is Safari 14.1. In a GRID container it is Safari 10.1.
          That gap between the two is why this is measured in JavaScript rather than asked
          with `@supports (gap: 1px)`: on Safari 12 that query answers YES — truthfully,
          about grid — and every flex gap in the app is then silently zero. The gate's whole
          layout is flex, so the screen arrives with every element touching its neighbour.

          The measurement: a column flex box with a 1px gap and two zero-height children is
          1px tall where gap works and 0px where it does not. Cheap, unambiguous, and it asks
          the browser about the exact property in the exact context rather than trusting a
          version table.
        */
        try {
          var probe = document.createElement("div");
          probe.style.cssText =
            "display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden";
          probe.appendChild(document.createElement("div"));
          probe.appendChild(document.createElement("div"));
          document.documentElement.appendChild(probe);
          var supported = probe.scrollHeight === 1;
          probe.parentNode.removeChild(probe);
          if (!supported) {
            // className, not classList.add: Safari 12 has classList, but this runs before
            // anything else and a string write cannot fail on an older engine either.
            document.documentElement.className += " no-flex-gap";
          }
        } catch (e) {
          /* A failed probe must not stop the gate booting. Gaps stay as they are. */
        }
      })();
    </script>


    <!--
      ═══════════════════════════════════════════════════════════════════════════
      THIS IS A SEPARATE APP, NOT A PAGE OF THE HR APP
      ═══════════════════════════════════════════════════════════════════════════
      The gate terminal installs as its own icon, with its own name, its own start URL and
      its own service-worker scope (`/kiosk`). Installing the HR app on the tablet at the
      entrance would give you an icon that opens somebody's payslips; installing this gives
      you a gate.

      It shares the repository — the face pipeline, the device pairing and the types are the
      same code — but it is a different build entry and a different installed artifact. The
      two can sit side by side on the same tablet without either knowing about the other.

      `display: fullscreen` in the manifest and `apple-mobile-web-app-capable` here remove
      the browser furniture. Locking the tablet so a passer-by cannot leave the app is not
      something a web page can do — that is Guided Access on iPadOS, or a managed kiosk
      policy on Android, and it belongs in the installation runbook rather than here.
    -->
    <link rel="manifest" href="/kiosk.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TT Gate" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!--
      A gate screen is a fixed installation, not a document. No text selection, no
      overscroll bounce, and a solid near-black ground so a slow first paint does not flash
      white in a dark lobby.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #0a0a0a;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* The boot message. Plain CSS, no build step, no Tailwind — it has to render on a
         browser that could not run the bundle that carries the stylesheet. */
      #kiosk-boot {
        box-sizing: border-box;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.5rem;
        color: #e5e5e5;
        font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #kiosk-boot h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 600;
      }
      #kiosk-boot p {
        margin: 0;
        max-width: 34rem;
        color: #a3a3a3;
      }
      #kiosk-boot .kiosk-boot-hint {
        color: #fbbf24;
      }
      #kiosk-boot pre {
        margin: 0.5rem 0 0;
        padding: 0.75rem;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
        border-radius: 0.5rem;
        background: #1c1917;
        color: #fca5a5;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      /*
        FLEX-GAP FALLBACK — only ever active when the probe above found gap broken.

        Margin on every child but the first reproduces `gap` for a single-line flex
        container, which is what the gate's layouts are. Scoped to `.flex` so grid
        containers, where Safari 12 honours gap properly, are left alone; `:not(.flex-col)`
        splits the axis, because Tailwind puts the direction in the markup and CSS cannot
        otherwise ask. Sizes are Tailwind's own scale, and only the steps the gate actually
        uses are here — an unused rule is a rule nobody checked.

        Known limit: a WRAPPING row gets a stray left margin on the first item of each new
        line. Nothing in the gate wraps, and a small misalignment on a browser this old is a
        better outcome than every control touching its neighbour.
      */
      .no-flex-gap .flex.gap-0\.5:not(.flex-col) > * + * { margin-left: 0.125rem; }
      .no-flex-gap .flex.flex-col.gap-0\.5 > * + * { margin-top: 0.125rem; }
      .no-flex-gap .flex.gap-1\.5:not(.flex-col) > * + * { margin-left: 0.375rem; }
      .no-flex-gap .flex.flex-col.gap-1\.5 > * + * { margin-top: 0.375rem; }
      .no-flex-gap .flex.gap-2:not(.flex-col) > * + * { margin-left: 0.5rem; }
      .no-flex-gap .flex.flex-col.gap-2 > * + * { margin-top: 0.5rem; }
      .no-flex-gap .flex.gap-2\.5:not(.flex-col) > * + * { margin-left: 0.625rem; }
      .no-flex-gap .flex.flex-col.gap-2\.5 > * + * { margin-top: 0.625rem; }
      .no-flex-gap .flex.gap-3:not(.flex-col) > * + * { margin-left: 0.75rem; }
      .no-flex-gap .flex.flex-col.gap-3 > * + * { margin-top: 0.75rem; }
      .no-flex-gap .flex.gap-5:not(.flex-col) > * + * { margin-left: 1.25rem; }
      .no-flex-gap .flex.flex-col.gap-5 > * + * { margin-top: 1.25rem; }
      .no-flex-gap .flex.gap-x-2 > * + * { margin-left: 0.5rem; }
      .no-flex-gap .flex.gap-x-3 > * + * { margin-left: 0.75rem; }
      .no-flex-gap .flex.flex-col.gap-y-1 > * + * { margin-top: 0.25rem; }
    </style>

    <meta name="robots" content="noindex, nofollow" />
    <title>TT Gate — Face Attendance</title>
  </head>
  <body>
    <!--
      THE ROOT IS NOT EMPTY, AND THAT IS THE POINT.

      This div used to be bare. With a near-black body behind it, ANY failure to mount —
      an unsupported API on an older Safari, a chunk that did not load, a thrown module —
      painted a solid black rectangle. Indistinguishable, on the device, from "the link
      does not open": no error, no text, nothing to report back. A gate terminal is often
      the one screen with nobody technical in front of it, so it has to say what is wrong
      in words.

      React's createRoot replaces these children on a successful mount, so this is only
      ever visible when something actually went wrong.
    -->
    <div id="kiosk-root">
      <div id="kiosk-boot" role="status">
        <h1>Starting the gate terminal…</h1>
        <p id="kiosk-boot-note">
          If this message stays on screen, the app could not start on this browser.
        </p>
        <p class="kiosk-boot-hint">
          Safari on iPhone or iPad needs <strong>iOS 15.4 or newer</strong>. Check
          Settings → General → Software Update, or open the link in Chrome to compare.
        </p>
        <pre id="kiosk-boot-error" hidden></pre>
      </div>
    </div>

    <noscript>
      <p style="color: #fca5a5; font: 16px/1.5 system-ui; padding: 1rem">
        JavaScript is switched off in this browser, so the gate terminal cannot run. Turn it
        on in Settings → Safari → Advanced, then reload.
      </p>
    </noscript>

    <script type="module" src="/src/kiosk/main.tsx"></script>
  </body>
</html>
