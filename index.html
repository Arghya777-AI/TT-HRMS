<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121F38" />

    <!--
      INSTALLABLE APP (PWA).

      `manifest` is what makes Chrome and Android offer "Install app"; the `apple-*` tags are
      what iOS reads, because Safari ignores most of the manifest. `apple-mobile-web-app-capable`
      is what removes the address bar once the icon is tapped from the home screen, and
      `status-bar-style: black-translucent` lets the app paint under the status bar — which is
      why the viewport above carries `viewport-fit=cover` and the shell pads with
      `env(safe-area-inset-*)`.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      CATCH THE INSTALL PROMPT BEFORE REACT EXISTS.

      `beforeinstallprompt` fires once, early, usually while the app's JavaScript is still
      downloading. A listener added later in a React effect simply misses it — and a missed
      event cannot be recovered, so the one-tap "Install app" button would never have appeared
      and every employee would have been sent to the manual steps instead. Stashing it here, in
      the document head, is the only place guaranteed to be listening in time.

      `preventDefault()` suppresses Chrome's own mini-infobar so ours is the single offer.
    -->
    <script>
      window.__ttInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__ttInstallPrompt = event;
        window.dispatchEvent(new Event("tt:install-available"));
      });
      window.addEventListener("appinstalled", function () {
        window.__ttInstallPrompt = null;
        window.dispatchEvent(new Event("tt:installed"));
      });
    </script>
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TT HRMS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Tamarind Tree HRMS</title>
    <meta
      name="description"
      content="Human Resource Management System for The Tamarind Tree — a unit of Machani Hospitalities LLP, Bengaluru."
    />
    <meta name="author" content="Machani Hospitalities LLP" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unna:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
